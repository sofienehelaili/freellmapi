# Isolated, loopback-only FreeLLMAPI on existing Oracle Always Free ARM64 instance.
# No cloud resources are provisioned and no existing Helaili containers are modified.
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    platform: linux/arm64
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - freellmapi-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then(r => { if(!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  freellmapi-data:
